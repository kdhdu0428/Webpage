<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <br>
        <br>
        <title>회원가입</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <style>
            .bg-light-gray {
                background-color: #f0f0f0;}

            .text-small{
                font-size: 13px;}
        </style>
    </head>

    <body>
     <div class="container mt-4">
        <b><h2 class="text-center text-primary">회원 가입</h2></b>
        <b><p class="text-center text-samll">회원 정보를 입력해 주세요</p></b>
        <hr>
        <div class="bg-light-gray p-4 rounded">
            <b><label class="mb-2">이름</label></b>
            <input type="text" placeholder="이름을 입력하세요." class="form-control"> <br>
            <b><label class="mb-2">이메일</label></b>
            <input type="text" placeholder="example@email.com" class="form-control"> <br>
            <b><label class="mb-2">비밀번호</label></b>
            <input type="password" placeholder="비밀번호" class="form-control"> <br>
 
            <b><p class="bg-info p-3 rounded">모든 항목을 입력해 주세요.</p></b>

            <div class="text-center">
                <button type="button" class="btn btn-primary" >가입하기</button>
                <button type="button" class="btn btn-danger">취소</button>        
            </div>
        
     
        </div>
    </body>
</html>
