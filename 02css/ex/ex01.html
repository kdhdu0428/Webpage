<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <title>css 기본 문법</title>

        <style>
            /* CSS 주석 */
            /* 셀렉터 */
            h3 {
                color:red; 
            }
            /* id 셀렉터 */
            #example {
                color: green;
            }

            #contents {
                color: navy;
                font-size:13px;
            }

            #title {
                color:crimson;
                font-size: 15px;
                font-weight: bold;
            }


            /* class 셀렉터 */
            .point {
                font-weight: bold;
                background-color: yellow;
            }
        </style>

    </head>

    <body>
        <h3>css(스타일시트)</h3>
        <h3 id="example">예제</h3>

        <!-- id 속성 : 모든 태그에 사용할 수 있는 속성
            태그를 구분하는 유일한 값 부여
            하나의 html안에서 같은 id를 가진 태그가 존재할 수 없다.

            class 속성 : 모든 태그에 사용할 수 있는 속성
            같은 특성을 가진 여러 태그를 표현할 때 사용
            여러 태그에 같은 값을 부여
        -->
        <p id="contents">
            <span id="title">CSS는 스타일 시트</span> 라고도 불립니다. <br>
            HTML 태그를 꾸미는 역할을 합니다. <br>
            정해진 <span class="point">속성</span>과 <span class="point">값</span>을 통해 스타일을 부여할 수 있습니다.

        </p>
    </body>
</html>
