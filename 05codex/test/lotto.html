<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <title>예금이자 계산기</title>
        
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <style>
            .bg-light-gray {background-color: #dddcdc;}

            .text-small{font-size: 13px;}
        </style>

    </head>
    <body>
        <div class ="container">
            <span class="important text-primary text-center"></span>
            <b><h2 class="text-center text-primary mt-5">예금 이자 계산</h2></b>
            <div class ="text-center">예금 정보를 입력하고 이자를 계산해 보세요.</div>
        <hr>
        <div class="bg-light-gray p-4 rounded">
                <h3 class="mb-4">예금 정보 입력</h3>
                <label class="mt-3 mb-2">예금 금액 (원)</label>
                <input type="number" id="number1Input" class="form-control "><br>
                <label class="mb-2">연이율 (%)</label>
                <input type="number" id="number2Input" class="form-control mt-2"><br>
                <label class="mb-2">예치 기간 (년)</label>
                <input type="number" id="number3Input" class="form-control mt-2"><br>
            
            <button type="button" id="plusBtn" class="btn btn-primary">이자 계산하기</button>
        </div>

        <div class="border p-4 rounded mt-3">
            <span class="important text-primary text-center"></span>
            <h3>계산 결과</h3>
            <hr>
            <div>예상 이자</div>
            <h4 class="text-success mt-2">
                <span id="interestSpan">13,600</span>원</h4>
            <div class="mt-3">만기시 총 금액</div>
            <h4 class="text-primary mt-2">
                <span id="totalSpan">213,600</span>원</h4>
        </div>
        <p class="text-secondary mt-2">※ 세금과 복리를 고려하지 않은 단리 계산입니다.</p>

        <script>
            const plusBtn = document.querySelector("#plusBtn");

            plusBtn.addEventListener("click", () => {
                const number1Input = document.querySelector("#number1Input");
                const amount = Number(number1Input.value);
                if(amount == "") {
                    alert("예금 금액을 입력하세요."); return;}

                const number2Input = document.querySelector("#number2Input");
                const rate = Number(number2Input.value);
                if(rate == "") {
                    alert("연이율을 입력하세요."); return;}
                
                const number3Input = document.querySelector("#number3Input");
                const years = Number(number3Input.value);                
                if(years == "") {
                    alert("예치기간을 입력하세요."); return;}

                const interest = amount * (rate / 100) * years;

                const interestSpan = document.querySelector("#interestSpan");
                interestSpan.textContent = Math.round(interest);

                const total = amount + interest;

                const totalSpan = document.querySelector("#totalSpan");
                totalSpan.textContent = total;        
            })
        </script>
    </body>
</html>
