<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로또 6/45 번호 추첨기</title>
    <link rel="stylesheet" href="css/lotto.css">
    <link rel="stylesheet" href="css/navigation.css">
    <script src="js/lotto.js" defer></script>
</head>
<body>
    <nav class="site-nav" aria-label="공통 내비게이션">
        <a href="index.html">메인 페이지</a>
        <a href="rps.html">가위바위보</a>
        <a href="lotto.html" aria-current="page">로또 번호 추첨기</a>
    </nav>
    <main class="lotto">
        <header class="page-header">
            <div class="title">
                <span class="title-mark" aria-hidden="true">✦</span>
                <div><h1>로또 <span>6/45</span></h1><p>번호 추첨기</p></div>
            </div>
            <button id="settings-button" type="button" aria-controls="settings" aria-expanded="false">⚙ 설정</button>
            <div id="settings" class="settings" hidden>
                <button id="theme-button" type="button" aria-pressed="false">다크 모드</button>
            </div>
        </header>

        <section class="card draw-card" aria-labelledby="draw-title">
            <h2 id="draw-title">번호 추첨</h2>
            <div class="modes" role="group" aria-label="추첨 방식">
                <button type="button" data-mode="auto" aria-pressed="true">자동</button>
                <button type="button" data-mode="manual" aria-pressed="false">수동</button>
                <button type="button" data-mode="semi" aria-pressed="false">반자동</button>
            </div>

            <div id="picker" hidden>
                <div class="picker-header">
                    <div><h3 id="picker-title">번호 선택</h3><p id="selection-count" role="status"></p></div>
                    <div class="actions">
                        <label id="manual-game-control" for="manual-game" hidden>선택 중인 게임
                            <select id="manual-game"></select>
                        </label>
                        <button id="clear-selection" type="button">선택 초기화</button>
                    </div>
                </div>
                <div id="number-grid" class="number-grid" role="group" aria-labelledby="picker-title"></div>
            </div>

            <div id="machine" class="machine" aria-hidden="true">
                <div class="drum"><div class="mixer">
                    <i></i><i></i><i></i><i></i><i></i><i></i>
                </div></div>
                <div class="chute"></div>
                <div class="machine-base"></div>
                <div class="tray" id="tray"></div>
            </div>
            <p id="progress" class="progress" role="status"></p>

            <div class="draw-controls">
                <label id="count-control" for="game-count">게임 수
                    <select id="game-count">
                        <option value="1">1게임</option><option value="2">2게임</option>
                        <option value="3">3게임</option><option value="4">4게임</option>
                        <option value="5">5게임</option>
                    </select>
                </label>
                <button class="primary" id="draw-button" type="button">번호 추첨</button>
            </div>
        </section>

        <section class="card results-card" aria-labelledby="results-title">
            <div class="section-header">
                <h2 id="results-title">추첨 결과</h2>
                <div class="actions">
                    <button id="redraw-button" type="button" disabled>재추첨</button>
                    <button id="reset-button" type="button" disabled>초기화</button>
                </div>
            </div>
            <p id="notice" class="notice" role="status"></p>
            <div id="results" class="entries"></div>
        </section>

        <details class="card archive">
            <summary>저장 번호 <span id="saved-count"></span></summary>
            <div id="saved" class="entries"></div>
        </details>
        <details class="card archive">
            <summary>추첨 기록 <span id="history-count"></span></summary>
            <div id="history" class="entries"></div>
        </details>

        <footer>자동 및 반자동 추첨 번호는 무작위로 생성되며, 당첨을 보장하지 않습니다.</footer>
    </main>
</body>
</html>
