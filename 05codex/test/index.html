<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>미니 게임</title>
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body>
    <nav class="site-nav" aria-label="공통 내비게이션">
        <a href="index.html" aria-current="page">메인 페이지</a>
        <a href="rps.html">가위바위보</a>
        <a href="lotto.html">로또 번호 추첨기</a>
    </nav>
    <main class="game-hub">
        <header class="hub-header">
            <h1>미니 게임</h1>
            <p>가위바위보로 컴퓨터와 대결하거나, 로또 6/45 번호를 뽑아 보세요.</p>
        </header>
        <div class="game-grid">
            <article class="game-card rps-card">
                <div class="game-art hand-art" aria-hidden="true">
                    <span>✊</span><span>✌️</span><span>✋</span>
                </div>
                <h2>가위바위보</h2>
                <p>컴퓨터와 한 판 겨루고, 승률과 최고 연승 기록을 확인해 보세요.</p>
                <a class="start-link" href="rps.html" aria-label="가위바위보 게임 시작">게임 시작</a>
            </article>
            <article class="game-card lotto-card">
                <div class="game-art lotto-art" aria-hidden="true">
                    <span>7</span><span>23</span><span>42</span>
                </div>
                <h2>로또 번호 추첨기</h2>
                <p>자동·수동·반자동으로 로또 6/45 번호를 뽑고, 마음에 드는 조합을 저장해 보세요.</p>
                <a class="start-link" href="lotto.html" aria-label="로또 번호 추첨기 게임 시작">게임 시작</a>
            </article>
        </div>
    </main>
</body>
</html>
