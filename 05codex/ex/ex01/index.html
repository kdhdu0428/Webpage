<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="길이와 무게 단위를 실시간으로 변환합니다.">
  <title>단위 변환기(Unit Converter)</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <nav class="site-nav" aria-label="주 메뉴">
        <a href="index.html" aria-current="page">메인</a>
        <a href="length.html">길이 변환</a>
        <a href="weight.html">무게 변환</a>
      </nav>
      <button id="theme" class="theme-toggle" type="button" aria-label="다크 모드" aria-pressed="false">
        <span class="sun" aria-hidden="true">☀</span><span class="moon" aria-hidden="true">☾</span>
      </button>
    </div>
  </header>

  <main class="dashboard">
    <header class="intro">
      <h1>단위 변환기<span class="english-title" lang="en">(Unit Converter)</span></h1>
    </header>

    <ul class="results converter-menu" aria-label="변환기 선택">
      <li>
        <a class="panel result-panel converter-card" href="length.html">
          <span class="converter-icon" aria-hidden="true"><span class="ruler"></span></span>
          <div>
            <h2>길이 단위 변환기</h2>
            <p>밀리미터부터 마일까지 8가지 길이 단위를 변환합니다.</p>
          </div>
          <span class="converter-arrow" aria-hidden="true">→</span>
        </a>
      </li>
      <li>
        <a class="panel result-panel converter-card" href="weight.html">
          <span class="converter-icon" aria-hidden="true"><span class="weight"></span></span>
          <div>
            <h2>무게 단위 변환기</h2>
            <p>밀리그램부터 미국 숏톤까지 8가지 무게 단위를 변환합니다.</p>
          </div>
          <span class="converter-arrow" aria-hidden="true">→</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
